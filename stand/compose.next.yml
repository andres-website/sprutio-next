# Новый стек (форк): образы собираются из исходников репозитория.
#   stand/dev.sh up-next     — собрать и поднять вместо оригинальных образов
# Песочница, ssl, var и тесты — общие с оригиналом, поэтому эталонные тесты гоняются на обоих стеках.
x-build: &build
  context: ../sprutio
  args:
    BASE: sprutio-next/python

services:
  base:
    image: sprutio-next/python
    build:
      context: ../sprutio
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"
    profiles: ["build"]

  app:
    image: sprutio-next/app
    build: {<<: *build, dockerfile: app/Dockerfile}
    environment:
      # ИИ-подсказки «через сервер»; на стенде — Ollama из профиля ai (stand/dev.sh up-ai)
      FM_AI_BASE_URL: ${FM_AI_BASE_URL:-}
      FM_AI_MODEL: ${FM_AI_MODEL:-}
      FM_AI_API_KEY: ${FM_AI_API_KEY:-}
      FM_AI_API: ${FM_AI_API:-completions}

  # Ollama для проверки ИИ-подсказок (не обязательна): только 127.0.0.1:11434 хоста и сеть стенда
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_ORIGINS: "*"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ./var/ollama:/root/.ollama
    restart: unless-stopped

  rpc:
    image: sprutio-next/rpc
    build: {<<: *build, dockerfile: rpc/Dockerfile}

  nginx:
    image: sprutio-next/nginx
    build: {context: ../sprutio, dockerfile: Dockerfile.nginx}

  frontend:
    image: sprutio-next/frontend
    build: {context: ../sprutio, dockerfile: Dockerfile.frontend}

  cron:
    image: sprutio-next/cron
    build: {<<: *build, dockerfile: Dockerfile.cron}

  redis:
    image: redis:7-alpine
